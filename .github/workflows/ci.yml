name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KDB_B64_LICENSE: ${{ secrets.KDB_B64_LICENSE }}
    steps:
      - name: Check out code and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check licence secret
        run: |
          if [ -z "$KDB_B64_LICENSE" ]; then
            echo "::error::KDB_B64_LICENSE secret is missing: add it under Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Install KDB-X
        run: |
          curl -fsSL --retry 3 --max-time 120 -o install_kdb.sh \
            "https://portal.dl.kx.com/assets/raw/kdb-x/install_kdb/~latest~/install_kdb.sh"
          sed -i 's/curl /curl --max-time 120 --retry 3 --retry-delay 5 /g' install_kdb.sh
          TERM=dumb bash install_kdb.sh -y --b64lic "$KDB_B64_LICENSE" < /dev/null
          rm -f install_kdb.sh
          echo "$HOME/.kx/bin" >> "$GITHUB_PATH"

      - name: q version
        run: echo '-1 "q ",string[.z.K]," ",string .z.k; exit 0' | q -q

      - name: Run qspec tests
        run: ./runtests.sh

      - name: JUnit report
        if: always()
        run: ./runtests.sh --junit > report.xml || true

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: report.xml
          check_name: qspec tests
